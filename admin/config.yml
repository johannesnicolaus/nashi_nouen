backend:
  name: github
  repo: johannesnicolaus/nashi_nouen
  branch: main
  app_id: Ov23lirchIf3p87azTMi

media_folder: /images
public_folder: /images

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: _posts
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, format: "YYYY-MM-DD", type: date, required: true }
      - { label: Body, name: body, widget: markdown }

  - name: staff_members
    label: Staff Members
    label_singular: Staff Member
    folder: _staff_members
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Image, name: image, widget: image }
      - { label: Position, name: position, widget: string, required: false }
      - { label: Bio, name: body, widget: markdown }

  - name: pricing
    label: Pricing
    label_singular: Pricing
    files:
      - name: pricing
        label: Pricing Page
        file: pricing.html
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Heading, name: heading, widget: string, required: false }
          - { label: Description, name: description, widget: string }
          - label: Pricing Table
            name: pricing_table
            widget: list
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Color, name: color, widget: color }
              - label: Features
                name: features
                widget: list
                fields:
                  - { label: Text, name: text, widget: string }
                  - { label: Highlight, name: highlight, widget: boolean, default: false }
          - label: FAQ
            name: faq
            widget: list
            fields:
              - { label: Question, name: question, widget: string }
              - { label: Answer, name: answer, widget: string }