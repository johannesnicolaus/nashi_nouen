backend:
  name: github
  repo: johannesnicolaus/nashi_nouen
  branch: main
  base_url: https://sveltia-cms-auth.johannes-nicolaus.workers.dev
  app_id: Ov23lirchIf3p87azTMi

media_folder: /images
public_folder: /images

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: _posts
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, format: "YYYY-MM-DD", type: date, required: true }
      - { label: Body, name: body, widget: markdown }

  - name: staff_members
    label: Staff Members
    label_singular: Staff Member
    folder: _staff_members
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Image, name: image, widget: image }
      - { label: Position, name: position, widget: string, required: false }
      - { label: Bio, name: body, widget: markdown }

  - name: reservation
    label: Reservation
    label_singular: Reservation
    files:
      - name: reservation
        label: Reservation Page
        file: reservation.html
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Heading, name: heading, widget: string, required: false }
          - { label: Description, name: description, widget: string }
          - label: Pricing Table
            name: pricing_table
            widget: list
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Color, name: color, widget: color }
              - label: Features
                name: features
                widget: list
                fields:
                  - { label: Text, name: text, widget: string }
                  - { label: Highlight, name: highlight, widget: boolean, default: false }
          - label: FAQ
            name: faq
            widget: list
            fields:
              - { label: Question, name: question, widget: string }
              - { label: Answer, name: answer, widget: string }
          - { label: Body, name: body, widget: hidden }

  - name: homepage
    label: Homepage
    label_singular: Homepage
    files:
      - name: homepage
        label: Homepage
        file: index.html
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Description, name: description, widget: string }
          - label: Hero Section
            name: hero
            widget: object
            fields:
              - { label: Main Title, name: h1, widget: string }
              - { label: Subtitle, name: subtext, widget: string }
          - label: About Section
            name: about
            widget: object
            fields:
              - { label: Heading, name: h2, widget: string }
              - { label: Description, name: p, widget: text }
          - label: Experience Section
            name: experience
            widget: object
            fields:
              - { label: Heading, name: h2, widget: string }
              - { label: Description, name: p, widget: text }
          - label: Vegetables Section
            name: vegetables
            widget: object
            fields:
              - { label: Heading, name: h2, widget: string }
              - { label: Description, name: p, widget: text }
          - label: Testimonial Section
            name: testimonial
            widget: object
            fields:
              - { label: Quote, name: quote, widget: text }
              - { label: Author, name: author, widget: string }
          - { label: CTA Heading, name: cta_heading, widget: string }